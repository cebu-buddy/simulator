<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留学費用シミュレーター｜セブ島留学バディー</title>
<meta name="description" content="学校・期間・コース・部屋タイプを選ぶだけで、セブ島留学の費用の目安がすぐ分かります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --teal:#49B0A8; --teal-d:#3A938C; --mint:#E7F4F3; --mint-d:#86C7C2; --pink:#E76874; --ink:#3D2613;
  --cream:#FFFCF6; --card:#fff; --line:#E9E2D6; --muted:#7a6a5a;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,#F1FAF8 0,var(--cream) 220px);line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 32px}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hero .sun{flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE9A8,#FFC55C);box-shadow:0 0 0 6px rgba(255,197,92,.22)}
.hero h1{font-size:20px;line-height:1.35;margin:0}
.hero p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;box-shadow:0 6px 18px rgba(58,147,140,.08)}
.step{margin-bottom:16px}
.step[hidden]{display:none}
.step.in{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lab{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:6px}
.lab i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:13px;display:grid;place-items:center}
select,input[type=search]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--mint-d);border-radius:14px;padding:12px 14px;min-height:48px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--teal-d) 50%),linear-gradient(135deg,var(--teal-d) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
select:focus,input:focus{outline:0;border-color:#F2B33D;box-shadow:0 0 0 4px rgba(255,197,92,.4)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #F2B33D;outline-offset:2px}
input[type=search]{margin-bottom:8px;min-height:44px;font-size:15px}
.chips{display:flex;flex-wrap:nowrap;gap:6px;margin-top:8px}
.chip{flex:1 1 0;min-width:0;white-space:nowrap;text-align:center;font:inherit;font-size:14px;border:2px solid var(--mint-d);background:#fff;color:var(--teal-d);border-radius:999px;padding:6px 2px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.result{margin-top:16px}
.result[hidden]{display:none}
.total{background:linear-gradient(135deg,#3FA59D,#2C7F78);color:#fff;border-radius:20px;padding:22px 14px 20px;text-align:center;box-shadow:0 10px 24px rgba(44,127,120,.32);border:3px solid #fff;outline:2px solid var(--teal)}
.total small{display:inline-block;font-size:15px;font-weight:700;letter-spacing:.1em;background:rgba(255,255,255,.22);padding:3px 16px;border-radius:999px;margin-bottom:6px}
.total .num{font-size:46px;font-weight:700;letter-spacing:.01em;line-height:1.2;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.total .num #totalNum{background:linear-gradient(transparent 90%,rgba(255,197,92,.6) 90%);padding:0 4px}
.total .ap{font-size:.45em;font-weight:700;margin-right:.3em}
.total .off{display:inline-block;margin-top:4px;background:#fff;color:var(--pink);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.rows{margin:14px 0 0;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.rows li:last-child{border-bottom:0}
.rows .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rows .neg .v{color:var(--pink)}
.rows .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.rows .free .v{color:var(--teal-d)}
.rate{font-size:12px;color:var(--muted);margin:8px 0 0}
.web5{margin-top:12px;background:#FFF3F4;border:1px solid #F7CBD0;border-radius:14px;padding:10px 12px;font-size:14px}
.web5 b{color:var(--pink)}
details{container-type:inline-size;margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:0 12px}
.slink{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--mint);border:1.5px solid var(--mint-d);border-radius:14px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.slink[hidden]{display:none}
.slink:hover{background:#DCEFED}
.slink .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--teal);display:grid;place-items:center}
.slink .tx{flex:1;min-width:0;line-height:1.4}
.slink .tx small{display:block;font-size:12px;color:var(--teal-d)}
.slink .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slink .ar{flex:none;color:var(--teal-d);font-size:20px;line-height:1}
.ct thead a.dl{display:inline-block;margin-top:5px;font-size:12px;font-weight:400;color:var(--teal-d);background:var(--mint);border-radius:999px;padding:3px 10px;text-decoration:none;white-space:nowrap}
.ct thead a.dl:hover{background:#DCEFED}
@media (max-width:350px){.chips{gap:4px}.chip{font-size:11px;border-width:1.5px}}
summary{cursor:pointer;font-weight:700;padding:12px 0;min-height:44px;white-space:nowrap;font-size:clamp(10px,calc((100cqw - 30px) / 18),16px)}
details .rows{margin-top:0;padding-bottom:6px}
.notes{margin:14px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted)}
.notes li{margin-bottom:4px;padding-left:1em;text-indent:-1em}
.notes li:before{content:"※ "}
.actions{display:grid;gap:10px;margin-top:16px}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 16px;min-height:50px;cursor:pointer}
.btn.line{background:#06C755;color:#fff;box-shadow:0 6px 14px rgba(6,199,85,.3)}
.btn.line:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--teal-d);border:2px solid var(--mint-d)}
.msg{margin-top:16px;padding:16px;border-radius:16px;background:var(--mint);font-size:15px}
.msg p{margin:0 0 10px}
.foot{margin-top:14px;font-size:11px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:.94}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.cmpbar{margin-top:26px;position:relative}
.vs{position:absolute;top:-14px;left:12px;background:#FFC55C;color:#3D2613;font-weight:700;font-size:13px;letter-spacing:.06em;padding:3px 14px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.18);transform:rotate(-4deg);pointer-events:none}
#cmpBtn[hidden] + .vs{display:none}
.cmpbar .btn{width:100%;background:#2F7DE1;border:0;color:#fff;box-shadow:0 6px 14px rgba(47,125,225,.3)}
.cmpbar .btn:focus-visible{outline-color:#F2B33D}
.cmp{margin-top:16px}
.cmp[hidden]{display:none}
.cmph{font-size:17px;margin:0 0 12px}
.cmpsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.cmpsel .lab{font-size:14px}
@media (min-width:500px){.cmpsel{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.cmpsel select{padding:12px 26px 12px 8px;font-size:14px;background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;text-overflow:ellipsis}}
.cmpsel [hidden]{display:none}
.ct{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.ct th,.ct td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top;word-break:break-word}
.ct thead th{font-size:13px;text-align:right;border-bottom:2px solid var(--mint-d)}
.ct thead th.i{text-align:left}
.ct thead small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.ct th.i,.ct td.i{text-align:left;font-weight:500}
.ct td.d{color:var(--muted)}
.ct td.n{white-space:nowrap}
@media (max-width:520px){.ct{font-size:12px}.ct th,.ct td{padding:8px 3px}.ct tr.tot td{font-size:12px;padding:12px 2px}.ct tr.tot td:first-child{font-size:12px}}
.ct td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ct td.neg{color:var(--pink)}
.ct tr.tot td{font-size:19px;font-weight:700;border-bottom:0;padding:14px 8px;background:#37988F;color:#fff;vertical-align:middle}
.ct tr.tot td:first-child{font-size:15px}
.ct tr.tot td small{color:inherit;font-weight:700;font-size:12px}
.ct tr.tot td.best{background:#FFC55C;color:#3D2613}

.ct td small{display:block;font-weight:400;color:var(--muted)}
.cmp .btn{margin-top:14px;width:100%}
@media (prefers-reduced-motion:reduce){.step.in{animation:none}.toast{transition:none}}
.ph{display:none}
@media (min-width:600px){
  .wrap{max-width:1040px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .total .num{font-size:36px}
  .chip{font-size:13px}
  .rows li{font-size:14px}
  .result{margin-top:0}
  .ph:not([hidden]){display:grid;place-items:center;min-height:220px;color:var(--muted);text-align:center;background:var(--mint);border-style:dashed}
}
@media (min-width:520px){.wrap{padding-top:28px}.hero h1{font-size:23px}}
@media (min-width:900px){.total .num{font-size:52px}.chip{font-size:14px}.rows li{font-size:15px}}
</style>
</head>

    const c=nm[i];
    if (c==="（" || c==="("){
      let d=0, j=i; for (; j<nm.length; j++){ if (nm[j]==="（"||nm[j]==="(") d++; else if (nm[j]==="）"||nm[j]===")"){ d--; if(d===0) break; } }
      if (j>=nm.length){ out+=nm.slice(i); break; }
      const inner=nm.slice(i+1,j), toks=[]; let cur="", dd=0;
      for (const ch of inner){ if(ch==="（"||ch==="(") dd++; if(ch==="）"||ch===")") dd--; if(ch==="・"&&dd===0){ toks.push(cur); cur=""; } else cur+=ch; }
      toks.push(cur);

      out += keep.length===toks.length ? nm.slice(i,j+1) : (keep.length ? c+keep.join("・")+nm[j] : "");
      i=j+1;
    } else { out+=c; i++; }
  }
  out = out.replace(/\s*1:\d×\d+(\s*[＋+]\s*(Group|グループ)×\d+)?/g,"").replace(/\s*[:：]\s*(?=[（(【]|$)/g,"").replace(/\s{2,}/g," ").trim();

function stripLessonCounts(){

    const next = arr.map(c=>(c && typeof c.name==="string") ? noLesson(c.name) : null);
    const cnt = {}; next.forEach(n=>{ if(n!==null) cnt[n]=(cnt[n]||0)+1; });
    arr.forEach((c,i)=>{ if (next[i]!==null && cnt[next[i]]===1) c.name = next[i]; });

function effective(s, regStr, todayStr){

  let hit=null, end=null;

    for (const [a,b] of tableRanges(x)){ if ((!a||d>=parseD(a)) && (!b||d<=parseD(b))){ hit=x; end=b; break; } }
    if (hit) break;
  }
  if (!hit && s.yearFallback && regStr && /^\d{4}-/.test(regStr) && +regStr.slice(0,4)!==s.yearFallback){
    const d2=parseD(s.yearFallback+regStr.slice(4));
    for (const x of T){ for (const [a,b] of tableRanges(x)){ if ((!a||d2>=parseD(a)) && (!b||d2<=parseD(b))){ hit=x; end=b; break; } } if (hit) break; }

  }
  if (hit) return Object.assign({}, s, hit, {_table:hit, _periodEnd:end});
  const firstFrom = tableRanges(T[0])[0][0];
  const near = (firstFrom && d<parseD(firstFrom)) ? T[0] : T[T.length-1];
  if (s.useNearestTable) return Object.assign({}, s, near, {_table:near, _periodEnd:null});

}

  function lineMap(qt) {
    var m = {};
    qt.lines.forEach(function (l) { var k = (l.id === "enroll" || l.id === "tuition" || l.id === "longdisc" || l.id === "round") ? l.id : "x:" + l.label; m[k] = { label: l.label, yen: l.yen }; });
    return m;
  }
  function localCell(qt) {
    if (qt.localInYen) return "上の金額に含む";
    if (qt.localIncluded) return "料金に含む";
    if (qt.localPending || qt.localUnknown) return "LINEでご案内";
    return "₱" + Math.round(qt.localPhp).toLocaleString("en-US") + "<small>≒ " + yen(qt.localYen) + "</small>";
  }
  function renderCmp() {
    $id("cmpBtn").hidden = !sel.key || cmpOpen;
    $id("cmp").hidden = !cmpOpen;
    if (!cmpOpen) return;
    normalize(sel2);
    var el = $id("school2");
    if (!el.options.length) el.innerHTML = '<option value="">学校選択</option>' + choices.map(function (c) { return '<option value="' + esc(c.key) + '">' + esc(c.label) + "</option>"; }).join("");
    el.value = sel2.key || "";
    var has = !!sel2.key && !!sel2.weeks;
    ["c2w", "c2c", "c2r"].forEach(function (i) { $id(i).hidden = !has; });
    if (has) {
      var base = { key: sel2.key, campusId: sel2.campusId };
      fill($id("weeks2"), C.getWeeks(ENV, base, today).map(function (w) { return { id: w, name: w + "週間" }; }), sel2.weeks);
      fill($id("course2"), C.getOptions(ENV, { key: sel2.key, campusId: sel2.campusId, weeks: sel2.weeks }, today).courses, sel2.courseId);
      fill($id("room2"), C.getRooms(ENV, { key: sel2.key, campusId: sel2.campusId, weeks: sel2.weeks, courseId: sel2.courseId }, today), sel2.roomId);
    }
    var A = resolve(sel), B = resolve(sel2);
    var dtd = function (n) { return '<td class="n d">' + (n > 0 ? "+" + yen(n) : n < 0 ? yen(n) : "−") + "</td>"; };
    var head = "<thead><tr><th class=\"i\"></th><th>" + esc(label(sel)) + "<small>" + esc(condText(sel)) + "</small>" + detailLink(sel) + "</th><th>" + (sel2.key ? esc(label(sel2)) + "<small>" + esc(condText(sel2)) + "</small>" + detailLink(sel2) : "比べる学校") + "</th><th>差額<small>右 − 左</small></th></tr></thead>";
    var rows = "";
    if (A.st === "ok" && B.st === "ok") {
      var ma = lineMap(A.qt), mb = lineMap(B.qt), extra = [];
      [ma, mb].forEach(function (m) { Object.keys(m).forEach(function (k) { if (k.indexOf("x:") === 0 && extra.indexOf(k) < 0) extra.push(k); }); });
      var keys = ["enroll", "tuition"].concat(extra, ["longdisc"]);
      var nm = { enroll: "入学金", tuition: "授業料および寮費", longdisc: "長期割引" };
      var cell = function (m, k) { return m[k] ? yen(m[k].yen) : "−"; };
      keys.forEach(function (k) { var lb = nm[k] || (ma[k] || mb[k]).label; rows += '<tr><td class="i">' + esc(lb) + '</td><td class="n' + (ma[k] && ma[k].yen < 0 ? " neg" : "") + '">' + cell(ma, k) + '</td><td class="n' + (mb[k] && mb[k].yen < 0 ? " neg" : "") + '">' + cell(mb, k) + "</td>" + dtd((mb[k] ? mb[k].yen : 0) - (ma[k] ? ma[k].yen : 0)) + "</tr>"; });
      if (WEB) rows += '<tr><td class="i">ウェブ限定5%OFF</td><td class="n neg">' + yen(A.qt.discount5Yen) + '</td><td class="n neg">' + yen(B.qt.discount5Yen) + "</td>" + dtd(B.qt.discount5Yen - A.qt.discount5Yen) + "</tr>";
      if (A.qt.adjustYen || B.qt.adjustYen) rows += '<tr><td class="i">端数調整</td><td class="n neg">' + (A.qt.adjustYen ? yen(A.qt.adjustYen) : "−") + '</td><td class="n neg">' + (B.qt.adjustYen ? yen(B.qt.adjustYen) : "−") + "</td>" + dtd(B.qt.adjustYen - A.qt.adjustYen) + "</tr>";
      var td = B.qt.totalYen - A.qt.totalYen;
      var ba = A.qt.totalYen < B.qt.totalYen ? " best" : "", bb = B.qt.totalYen < A.qt.totalYen ? " best" : "";
      rows += '<tr class="tot"><td class="i">費用の目安（約）</td><td class="n' + ba + '">' + yen(A.qt.totalYen) + (ba ? "<small>★ 安い</small>" : "") + '</td><td class="n' + bb + '">' + yen(B.qt.totalYen) + (bb ? "<small>★ 安い</small>" : "") + "</td><td class=\"n d\">" + (td === 0 ? "同額" : (td > 0 ? "+" : "") + yen(td)) + "</td></tr>";
    } else {
      var tx = function (r) { return r.st === "ok" ? yen(r.qt.totalYen) : STATE_TXT[r.st]; };
      rows = '<tr class="tot"><td class="i">費用の目安（約）</td><td class="n">' + tx(A) + '</td><td class="n">' + (B.st === "none" && !sel2.key ? "学校を選んでください" : tx(B)) + '</td><td class="n d"></td></tr>';
    }
    $id("cmpTable").innerHTML = '<table class="ct"><colgroup><col style="width:18%"><col style="width:28%"><col style="width:28%"><col style="width:26%"></colgroup>' + head + "<tbody>" + rows + "</tbody></table>" +
      '<ul class="notes"><li>' + (WEB ? "どちらも、ウェブ限定5%OFFと端数調整を含んだ、成人1名の単身留学の目安です。割引が禁止されている学校は、5%割引の対象外です。" : "どちらも、1名の単身留学の場合の目安額です。") + "</li></ul>";
  }

  function update() {
    var ok = normalize(sel);
    renderSteps(); renderSchoolLink(); render(); renderCmp();
    $id("ph").hidden = !$id("result").hidden;
    if (ok) { var s = storage(); if (s) C.saveLast(s, sel); }
    postHeight();
  }

  // ---- 親ページへの高さの通知（記事のiframeが、中身に合わせて伸びる） ----
  var lastH = 0;
  function postHeight() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h === lastH) return; lastH = h;
    try { if (window.parent !== window) window.parent.postMessage({ type: "sim-height", height: h }, "*"); } catch (e) { /* 通知できない環境では、何もしない */ }
  }
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener("load", postHeight);

  function toast(t) { var el = $id("toast"); el.textContent = t; el.classList.add("show"); setTimeout(function () { el.classList.remove("show"); }, 1800); }
  function shareUrl() {
    var p = new URLSearchParams({ school: sel.key, course: sel.courseId, room: sel.roomId, weeks: sel.weeks });
    return location.origin + location.pathname + "?" + p.toString();
  }

  // ---- 操作 ----
  $id("filter").addEventListener("input", renderSchools);
  $id("school").addEventListener("change", function (e) { sel = e.target.value ? { key: e.target.value } : {}; update(); });
  $id("weeks").addEventListener("change", function (e) { sel.weeks = +e.target.value; update(); });
  $id("course").addEventListener("change", function (e) { sel.courseId = e.target.value; update(); });
  $id("room").addEventListener("change", function (e) { sel.roomId = e.target.value; update(); });
  $id("cmpBtn").addEventListener("click", function () { cmpOpen = true; sel2 = {}; update(); });
  $id("cmpLine").href = LINE_URL;
  $id("school2").addEventListener("change", function (e) { sel2 = e.target.value ? { key: e.target.value } : {}; update(); });
  $id("weeks2").addEventListener("change", function (e) { sel2.weeks = +e.target.value; update(); });
  $id("course2").addEventListener("change", function (e) { sel2.courseId = e.target.value; update(); });
  $id("room2").addEventListener("change", function (e) { sel2.roomId = e.target.value; update(); });
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("chip")) { sel.weeks = +t.getAttribute("data-w"); update(); }
    if (t.id === "retry") { rate.status = "idle"; update(); }
    if (t.id === "share") {
      var u = shareUrl();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(function () { toast("URLをコピーしました"); }, function () { window.prompt("このURLをコピーしてください", u); });
      else window.prompt("このURLをコピーしてください", u);
    }
  });

  // ---- 初期状態: URL → 前回の条件 → 何も選ばない ----
  var fromUrl = C.parseParams(location.search, ENV, today), last = null;
  var st = storage(); if (st) last = C.loadLast(st);
  if (fromUrl.key) sel = fromUrl;
  else if (last && last.key && choices.some(function (c) { return c.key === last.key; })) sel = { key: last.key, weeks: last.weeks, courseId: last.courseId, roomId: last.roomId };
  renderSchools();
  update();
})();
</script>
</body>
</html>
